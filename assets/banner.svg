<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F17"/>
      <stop offset="100%" stop-color="#17331F"/>
    </linearGradient>
    <linearGradient id="vineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="45%" stop-color="#4C7A3D"/>
      <stop offset="100%" stop-color="#8FD14F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <pattern id="circuit" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0,30 H60 M30,0 V60" stroke="#8FD14F" stroke-width="0.5" opacity="0.5"/>
      <circle cx="30" cy="30" r="1.6" fill="#8FD14F" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="280" rx="20" fill="url(#circuit)" opacity="0.08"/>

  <!-- textura de semillas -->
  <g fill="#8FD14F" opacity="0.25">
    <circle cx="90" cy="240" r="3"/>
    <circle cx="130" cy="255" r="2"/>
    <circle cx="170" cy="235" r="2.5"/>
    <circle cx="980" cy="240" r="2"/>
    <circle cx="1030" cy="250" r="2.5"/>
  </g>

  <!-- particulas ascendentes -->
  <g fill="#9FCB8C">
    <circle cx="250" cy="220" r="2">
      <animate attributeName="cy" values="220;40;220" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="230" r="1.6">
      <animate attributeName="cy" values="230;60;230" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="225" r="1.8">
      <animate attributeName="cy" values="225;50;225" dur="10s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- vid principal: se dibuja al cargar -->
  <path id="vine" d="M60,235 C180,190 220,150 340,160 C460,170 480,100 600,110 C720,120 740,175 860,155 C960,140 1000,90 1110,65"
        fill="none" stroke="url(#vineGrad)" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="3000" stroke-dashoffset="3000">
    <animate attributeName="stroke-dashoffset" from="3000" to="0" dur="3s" begin="0.2s" fill="freeze"/>
  </path>

  <!-- zarcillos pequeños -->
  <path d="M400,155 q10,-15 -5,-25" fill="none" stroke="#6FA83A" stroke-width="2" opacity="0.8"/>
  <path d="M700,115 q-12,-12 2,-24" fill="none" stroke="#6FA83A" stroke-width="2" opacity="0.8"/>

  <!-- hojas con leve balanceo -->
  <g fill="#7CB342" transform="translate(340,160)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 0;4 0 0;-4 0 0" dur="4s" repeatCount="indefinite"/>
      <path d="M0,0 C-10,-22 15,-30 28,-12 C18,2 8,6 0,0 Z"/>
    </g>
  </g>
  <g fill="#8FD14F" transform="translate(600,110) rotate(15)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="5s" begin="0.5s" repeatCount="indefinite"/>
      <path d="M0,0 C-10,-22 15,-30 28,-12 C18,2 8,6 0,0 Z"/>
    </g>
  </g>
  <g fill="#6FA83A" transform="translate(860,155) rotate(-10)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 0;4 0 0;-4 0 0" dur="4.5s" begin="1s" repeatCount="indefinite"/>
      <path d="M0,0 C-8,-18 12,-26 24,-10 C15,3 6,5 0,0 Z"/>
    </g>
  </g>
  <g fill="#8FD14F" transform="translate(460,150) rotate(200)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 0;4 0 0;-4 0 0" dur="4.2s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M0,0 C-8,-16 10,-22 20,-9 C13,2 5,4 0,0 Z"/>
    </g>
  </g>

  <!-- brote / flor pequeña -->
  <g transform="translate(210,152)">
    <circle r="4" fill="#F2C14E">
      <animate attributeName="r" values="3;4.5;3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- chip / circuito donde termina la vid -->
  <g transform="translate(1090,42)">
    <circle cx="20" cy="20" r="34" fill="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="4" y="4" width="34" height="30" rx="4" fill="#C9A227" stroke="#8B6F1D" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="4" y2="10" stroke="#C9A227" stroke-width="2"/>
    <line x1="0" y1="20" x2="4" y2="20" stroke="#C9A227" stroke-width="2"/>
    <line x1="0" y1="28" x2="4" y2="28" stroke="#C9A227" stroke-width="2"/>
    <line x1="38" y1="10" x2="42" y2="10" stroke="#C9A227" stroke-width="2"/>
    <line x1="38" y1="20" x2="42" y2="20" stroke="#C9A227" stroke-width="2"/>
    <line x1="38" y1="28" x2="42" y2="28" stroke="#C9A227" stroke-width="2"/>
    <circle cx="10" cy="12" r="1.4" fill="#0B1F17">
      <animate attributeName="fill" values="#0B1F17;#8FD14F;#0B1F17" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="26" r="1.4" fill="#0B1F17">
      <animate attributeName="fill" values="#0B1F17;#8FD14F;#0B1F17" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- texto -->
  <text x="60" y="95" font-family="'Fira Code', 'Courier New', monospace" font-size="44" font-weight="700" fill="#EAF4E1" opacity="0">
    Dominic Escobar
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.3s" fill="freeze"/>
  </text>
  <text x="63" y="128" font-family="'Fira Code', 'Courier New', monospace" font-size="17" fill="#9FCB8C" opacity="0">
    cultivando código &amp; plantas — Ingeniería en Software
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.8s" fill="freeze"/>
  </text>
</svg>
